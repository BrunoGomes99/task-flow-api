# Single pipeline (format A): CI on every PR/push; ECR publish only after
# the GitHub Environment "production" approval gate on main (or manual dispatch).
#
# Auth for publish: GitHub OIDC → IAM role (no long-lived AWS keys in the workflow).
# Configure repo Variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION          e.g. us-east-1
#   AWS_ROLE_TO_ASSUME  ARN of a role trustable by GitHub OIDC (ECR push permissions)
#   ECR_REPOSITORY      e.g. taskflow-api
#
# Also create Environment "production" with required reviewers so the publish job waits
# for a manual Approve click (workplace-style promotion gate).
#
# Scope of "deploy" in this phase: build + push image to ECR. The EC2 host does not
# auto-redeploy; see infra/README.md for pull/up after publish.

name: CI

on:
  push:
    branches: [main, "dev"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TaskFlow.slnx

      - name: Build
        run: dotnet build TaskFlow.slnx --no-restore -c Release --verbosity minimal

      - name: Test
        run: dotnet test TaskFlow.slnx --no-build -c Release --verbosity normal

  publish-ecr:
    name: Publish API image to ECR
    needs: build-and-test
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"
          docker build -f src/TaskFlow.Api/Dockerfile -t "${IMAGE_URI}:${IMAGE_TAG}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "Pushed ${IMAGE_URI}:${IMAGE_TAG} and ${IMAGE_URI}:latest"
