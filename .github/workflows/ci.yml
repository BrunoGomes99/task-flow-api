# CI on every PR and push; ECR publish of the three Dockerfiles after the
# `production` environment on `main`. Publish is followed by `ecs update-service`
# for the three .NET services.
#
# Auth: GitHub OIDC → IAM role (no long-lived AWS keys in the workflow).
# Configure repo Variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION
#   AWS_ROLE_TO_ASSUME   ARN of a role trustable by GitHub OIDC (ECR push and ECS deploy)
#   API_REPOSITORY, SCHEDULER_REPOSITORY, NOTIFICATIONS_REPOSITORY
#   ECS_CLUSTER, ECS_SERVICE_API, ECS_SERVICE_SCHEDULER, ECS_SERVICE_NOTIFICATIONS
#   ALB_DNS_NAME
#
# Also create Environment "production" with required reviewers so publish waits for Approve.

name: CI

on:
  push:
    branches: [main, "dev"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TaskFlow.slnx

      - name: Build
        run: dotnet build TaskFlow.slnx --no-restore -c Release --verbosity minimal

      - name: Test
        run: dotnet test TaskFlow.slnx --no-build -c Release --verbosity normal

  publish-ecr:
    name: Publish images to ECR
    needs: build-and-test
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ github.sha }}
      registry: ${{ steps.ecr-login.outputs.registry }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_REPOSITORY: ${{ vars.API_REPOSITORY }}
      SCHEDULER_REPOSITORY: ${{ vars.SCHEDULER_REPOSITORY }}
      NOTIFICATIONS_REPOSITORY: ${{ vars.NOTIFICATIONS_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push images
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}          
        run: |
          set -euo pipefail
          build_push() {
            local dockerfile="$1"
            local repo="$2"
            local uri="${REGISTRY}/${repo}"
            docker build -f "${dockerfile}" -t "${uri}:${IMAGE_TAG}" -t "${uri}:latest" .
            docker push "${uri}:${IMAGE_TAG}"
            docker push "${uri}:latest"
            echo "Pushed ${uri}:${IMAGE_TAG} and ${uri}:latest"
          }
          build_push src/TaskFlow.Api/Dockerfile "${API_REPOSITORY}"
          build_push src/TaskFlow.Scheduler/Dockerfile "${SCHEDULER_REPOSITORY}"
          build_push src/TaskFlow.Notifications/Dockerfile "${NOTIFICATIONS_REPOSITORY}"

  deploy-ecs:
    name: Deploy github.sha to ECS
    needs: publish-ecr
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_REPOSITORY: ${{ vars.API_REPOSITORY }}
      SCHEDULER_REPOSITORY: ${{ vars.SCHEDULER_REPOSITORY }}
      NOTIFICATIONS_REPOSITORY: ${{ vars.NOTIFICATIONS_REPOSITORY }}
      IMAGE_TAG: ${{ needs.publish-ecr.outputs.image_tag }}
      REGISTRY: ${{ needs.publish-ecr.outputs.registry }}
      ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register revisions and update services
        run: |
          set -euo pipefail
          deploy_service() {
            local family="$1"
            local container="$2"
            local image="$3"
            local current
            current="$(aws ecs describe-task-definition --task-definition "$family" --query 'taskDefinition' --output json)"
            local payload
            payload="$(echo "$current" | jq --arg container "$container" --arg image "$image" --arg version "$IMAGE_TAG" '
              .containerDefinitions |= map(
                if .name == $container then
                  .image = $image
                  | .environment |= map(if .name == "SERVICE_VERSION" then .value = $version else . end)
                elif .name == "adot" then
                  .environment |= map(if .name == "SERVICE_VERSION" then .value = $version else . end)
                else
                  .
                end
              )
              | {
                  family,
                  taskRoleArn,
                  executionRoleArn,
                  networkMode,
                  containerDefinitions,
                  volumes,
                  placementConstraints,
                  requiresCompatibilities,
                  cpu,
                  memory,
                  runtimePlatform,
                  pidMode,
                  ipcMode
                }
              | with_entries(select(.value != null))
            ')"
            local arn
            arn="$(aws ecs register-task-definition --cli-input-json "$payload" --query 'taskDefinition.taskDefinitionArn' --output text)"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$family" \
              --task-definition "$arn" \
              --query 'service.serviceName' \
              --output text
          }
          deploy_service "${{ vars.ECS_SERVICE_API }}" "taskflow-api" "${REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}"
          deploy_service "${{ vars.ECS_SERVICE_SCHEDULER }}" "taskflow-scheduler" "${REGISTRY}/${SCHEDULER_REPOSITORY}:${IMAGE_TAG}"
          deploy_service "${{ vars.ECS_SERVICE_NOTIFICATIONS }}" "taskflow-notifications" "${REGISTRY}/${NOTIFICATIONS_REPOSITORY}:${IMAGE_TAG}"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "${{ vars.ECS_SERVICE_API }}" "${{ vars.ECS_SERVICE_SCHEDULER }}" "${{ vars.ECS_SERVICE_NOTIFICATIONS }}"
          curl -fsS "http://${ALB_DNS_NAME}/health/ready"
          echo "Deploy OK: ${IMAGE_TAG}"
