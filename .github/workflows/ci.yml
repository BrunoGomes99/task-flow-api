# CI on every PR and push; ECR publish of the three Dockerfiles after the
# `production` environment on `main`. Publish does not deploy. Deploy until
# the CD plan is `terraform apply` with the image tag variables.
#
# Auth: GitHub OIDC → IAM role (no long-lived AWS keys in the workflow).
# Configure repo Variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION
#   AWS_ROLE_TO_ASSUME   ARN of a role trustable by GitHub OIDC (ECR push)
#   API_REPOSITORY, SCHEDULER_REPOSITORY, NOTIFICATIONS_REPOSITORY
#
# Also create Environment "production" with required reviewers so publish waits for Approve.

name: CI

on:
  push:
    branches: [main, "dev"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TaskFlow.slnx

      - name: Build
        run: dotnet build TaskFlow.slnx --no-restore -c Release --verbosity minimal

      - name: Test
        run: dotnet test TaskFlow.slnx --no-build -c Release --verbosity normal

  publish-ecr:
    name: Publish images to ECR
    needs: build-and-test
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ github.sha }}
      registry: ${{ steps.ecr-login.outputs.registry }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_REPOSITORY: ${{ vars.API_REPOSITORY }}
      SCHEDULER_REPOSITORY: ${{ vars.SCHEDULER_REPOSITORY }}
      NOTIFICATIONS_REPOSITORY: ${{ vars.NOTIFICATIONS_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push images
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}          
        run: |
          set -euo pipefail
          build_push() {
            local dockerfile="$1"
            local repo="$2"
            local uri="${REGISTRY}/${repo}"
            docker build -f "${dockerfile}" -t "${uri}:${IMAGE_TAG}" -t "${uri}:latest" .
            docker push "${uri}:${IMAGE_TAG}"
            docker push "${uri}:latest"
            echo "Pushed ${uri}:${IMAGE_TAG} and ${uri}:latest"
          }
          build_push src/TaskFlow.Api/Dockerfile "${API_REPOSITORY}"
          build_push src/TaskFlow.Scheduler/Dockerfile "${SCHEDULER_REPOSITORY}"
          build_push src/TaskFlow.Notifications/Dockerfile "${NOTIFICATIONS_REPOSITORY}"
